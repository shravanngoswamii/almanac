name: Site publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm --filter www build
        env:
          BASE_PATH: /almanac/
          PUBLIC_UMAMI_WEBSITE_ID: ${{ secrets.PUBLIC_UMAMI_WEBSITE_ID }}

      # Pages would otherwise strip directories beginning with an underscore,
      # which is where Astro puts its built assets.
      - name: Add .nojekyll file
        run: touch ./www/dist/.nojekyll

      - name: Publish
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: www/dist
          branch: gh-pages
